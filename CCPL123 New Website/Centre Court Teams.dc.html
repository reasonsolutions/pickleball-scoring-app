<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    @font-face{font-family:'Zuume Cut';src:url('uploads/zuume-cut-black-italic.ttf') format('truetype');font-weight:900;font-style:italic;}
    @font-face{font-family:'Zuume Cut';src:url('uploads/zuume-cut-bold.ttf') format('truetype');font-weight:700;font-style:normal;}
    body{margin:0;background:#0b0b0c;}
    a{color:#ee3a24;}
    a:hover{color:#ffffff;}
    ::selection{background:#ee3a24;color:#0b0b0c;}
    @keyframes cc-pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes cc-fade-up{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    @keyframes cc-line-grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
    .cc-in{opacity:0;animation:cc-fade-up .8s cubic-bezier(.16,1,.3,1) forwards;}
    .cc-team{transition:border-color .3s ease,background .3s ease,transform .5s cubic-bezier(.16,1,.3,1);}
    .cc-team:hover{border-color:rgba(255,255,255,0.5) !important;background:#121213 !important;transform:translateY(-5px);}
    .cc-team:hover .cc-team-name{color:#ee3a24 !important;}
    .cc-team:hover .cc-arrow{transform:translateX(5px);opacity:1 !important;}
    .cc-arrow{transition:transform .3s ease,opacity .3s ease;}
  </style>
</helmet>

<dc-import name="Centre Court Nav" current="teams" hint-size="100%,146px"></dc-import>

<section style="position:relative;background:#0b0b0c;color:#fff;font-family:'Montserrat',sans-serif;padding:{{sectionPadding}};box-sizing:border-box;overflow:hidden;">

  <div style="position:absolute;top:32px;left:6vw;right:6vw;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.5),rgba(255,255,255,0) 75%);transform-origin:left;animation:cc-line-grow 1.1s cubic-bezier(.16,1,.3,1) both;"></div>
  <div style="position:absolute;top:26px;left:6vw;width:1px;height:13px;background:#fff;"></div>
  <div style="position:absolute;top:26px;right:6vw;width:1px;height:13px;background:#fff;"></div>

  <div class="cc-in" style="position:relative;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:{{topMetaMargin}};animation-delay:.05s;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:6px;height:6px;border-radius:50%;background:{{accentColor}};animation:cc-pulse 2s ease-in-out infinite;"></div>
      <span style="font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.6);">CCPL Hyderabad / Season 2</span>
    </div>
    <span style="font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.6);">Eight Franchises</span>
  </div>

  <div style="position:relative;display:grid;grid-template-columns:{{headerGridCols}};align-items:end;gap:20px;margin-bottom:{{headerMargin}};">
    <h1 style="font-family:'Zuume Cut',sans-serif;font-weight:500;font-size:clamp(52px,8vw,132px);line-height:0.86;margin:0;text-transform:uppercase;">
      The<br>Franchises.
    </h1>
    <p class="cc-in" style="margin:0;max-width:{{introMaxWidth}};font-size:16px;line-height:1.65;color:rgba(255,255,255,0.6);animation-delay:.3s;">
      Eight franchises. One round robin, seven matchdays, every squad on court each week. Pick a badge to see its roster.
    </p>
  </div>

  <div style="position:relative;display:grid;grid-template-columns:{{gridCols}};gap:{{gridGap}};">
    <sc-for list="{{teams}}" as="team" hint-placeholder-count="8">
      <a href="{{team.href}}" class="cc-team cc-in" style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:{{cardPadding}};border:1px solid rgba(255,255,255,0.16);background:#0e0e0f;text-decoration:none;color:#fff;animation-delay:{{team.delay}};">
        <div style="position:absolute;top:10px;left:10px;width:12px;height:12px;border-top:2px solid rgba(255,255,255,0.35);border-left:2px solid rgba(255,255,255,0.35);"></div>
        <span style="position:absolute;top:14px;right:16px;font-family:'Zuume Cut',sans-serif;font-weight:500;font-size:14px;color:rgba(255,255,255,0.3);">{{team.num}}</span>
        <div style="width:{{logoSize}};height:{{logoSize}};display:flex;align-items:center;justify-content:center;">
          <image-slot id="{{team.slotId}}" shape="rect" placeholder="Drop team logo" style="width:100%;height:100%;"></image-slot>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
          <span class="cc-team-name" style="font-family:'Zuume Cut',sans-serif;font-weight:500;font-size:26px;line-height:1;text-transform:uppercase;color:#fff;transition:color .3s ease;">{{team.name}}</span>
          <span style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.4);">{{team.tag}}</span>
        </div>
        <span class="cc-arrow" style="display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:{{accentColor}};opacity:0.55;">View team <span style="font-size:14px;">&rarr;</span></span>
      </a>
    </sc-for>
  </div>

  <div class="cc-in" style="position:relative;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:{{footerMargin}};animation-delay:.9s;">
    <span style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.35);">Every player represents more than themselves.</span>
    <a href="Centre Court Player Signup.dc.html" style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.55);text-decoration:underline;">Enter the auction pool</a>
  </div>
</section>

<dc-import name="Centre Court Footer" hint-size="100%,120px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ee3a24&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ee3a24&quot;,&quot;#ff5a3c&quot;,&quot;#b3001b&quot;]}}">
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' && window.innerWidth < 860 };

  updateSize = () => {
    const isMobile = window.innerWidth < 860;
    this.setState(s => (s.isMobile === isMobile ? null : { isMobile }));
  };
  componentDidMount() { window.addEventListener('resize', this.updateSize); }
  componentWillUnmount() { window.removeEventListener('resize', this.updateSize); }

  renderVals() {
    const accentColor = this.props.accentColor ?? '#ee3a24';
    const isMobile = this.state.isMobile;
    const raw = [
      { slug: 'team-01', name: 'Team One', tag: 'Franchise 01' },
      { slug: 'team-02', name: 'Team Two', tag: 'Franchise 02' },
      { slug: 'team-03', name: 'Team Three', tag: 'Franchise 03' },
      { slug: 'team-04', name: 'Team Four', tag: 'Franchise 04' },
      { slug: 'team-05', name: 'Team Five', tag: 'Franchise 05' },
      { slug: 'team-06', name: 'Team Six', tag: 'Franchise 06' },
      { slug: 'team-07', name: 'Team Seven', tag: 'Franchise 07' },
      { slug: 'team-08', name: 'Team Eight', tag: 'Franchise 08' },
    ];
    const teams = raw.map((t, i) => ({
      name: t.name,
      tag: t.tag,
      num: String(i + 1).padStart(2, '0'),
      slotId: 'team-logo-' + t.slug,
      href: 'Centre Court Team.dc.html?team=' + t.slug,
      delay: (0.4 + i * 0.06).toFixed(2) + 's',
    }));
    return {
      accentColor, teams,
      sectionPadding: isMobile ? '32px 6vw 56px' : '56px 6vw 88px',
      topMetaMargin: isMobile ? '36px' : '52px',
      headerGridCols: isMobile ? '1fr' : '1fr 340px',
      headerMargin: isMobile ? '36px' : '64px',
      introMaxWidth: isMobile ? '100%' : '340px',
      gridCols: isMobile ? '1fr 1fr' : 'repeat(4, 1fr)',
      gridGap: isMobile ? '14px' : '22px',
      cardPadding: isMobile ? '32px 16px 26px' : '44px 24px 32px',
      logoSize: isMobile ? '78px' : '110px',
      footerMargin: isMobile ? '44px' : '64px',
    };
  }
}

</script>
</body>
</html>

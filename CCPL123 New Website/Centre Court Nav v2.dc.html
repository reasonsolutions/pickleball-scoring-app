class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' && window.innerWidth < 960, menuOpen: false };

    const isMobile = window.innerWidth < 960;
    this.setState(s => (s.isMobile === isMobile ? null : { isMobile, menuOpen: isMobile ? s.menuOpen : false }));
  };
  componentDidMount() { window.addEventListener('resize', this.updateSize); }
  componentWillUnmount() { window.removeEventListener('resize', this.updateSize); }

  renderVals() {
    const current = this.props.current ?? 'overview';

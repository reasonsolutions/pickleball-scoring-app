<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    @font-face{font-family:'Zuume Cut';src:url('uploads/zuume-cut-black-italic.ttf') format('truetype');font-weight:900;font-style:italic;}
    @font-face{font-family:'Zuume Cut';src:url('uploads/zuume-cut-bold.ttf') format('truetype');font-weight:700;font-style:normal;}
    body{margin:0;background:#0b0b0c;}
    a{color:#ee3a24;}
    a:hover{color:#ffffff;}
    ::selection{background:#ee3a24;color:#0b0b0c;}
    @keyframes cc-pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes cc-fade-up{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    .cc-in{opacity:0;animation:cc-fade-up .8s cubic-bezier(.16,1,.3,1) forwards;}
    .cc-player{transition:background .25s ease;}
    .cc-player:hover{background:#131314 !important;}
    .cc-back{transition:gap .25s ease;}
    .cc-back:hover{gap:14px !important;}
  </style>
</helmet>

<dc-import name="Centre Court Nav" current="teams" hint-size="100%,146px"></dc-import>

<section style="position:relative;background:#0b0b0c;color:#fff;font-family:'Montserrat',sans-serif;padding:{{sectionPadding}};box-sizing:border-box;overflow:hidden;">

  <a href="Centre Court Teams.dc.html" class="cc-back cc-in" style="position:relative;display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.55);text-decoration:none;margin-bottom:{{backMargin}};animation-delay:.05s;">
    <span style="font-size:14px;">&larr;</span> All franchises
  </a>

  <div style="position:relative;display:grid;grid-template-columns:{{heroCols}};gap:{{heroGap}};align-items:center;padding-bottom:{{heroPadBottom}};border-bottom:1px solid rgba(255,255,255,0.14);">
    <div class="cc-in" style="position:relative;width:{{logoBox}};height:{{logoBox}};border:1px solid rgba(255,255,255,0.18);background:#0e0e0f;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;animation-delay:.15s;">
      <div style="position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid #fff;border-left:2px solid #fff;"></div>
      <div style="position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid #fff;border-right:2px solid #fff;"></div>
      <image-slot id="{{slotId}}" shape="rect" placeholder="Drop team logo" style="width:100%;height:100%;"></image-slot>
    </div>

    <div class="cc-in" style="animation-delay:.25s;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <div style="width:6px;height:6px;border-radius:50%;background:{{accentColor}};animation:cc-pulse 2s ease-in-out infinite;"></div>
        <span style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.55);">{{teamTag}} &mdash; CCPL Hyderabad</span>
      </div>
      <h1 style="font-family:'Zuume Cut',sans-serif;font-weight:900;font-style:italic;font-size:clamp(48px,7vw,110px);line-height:0.88;margin:0 0 20px;text-transform:uppercase;">{{teamName}}</h1>
      <div style="display:flex;flex-wrap:wrap;gap:{{statGap}};">
        <sc-for list="{{stats}}" as="stat" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:4px;">
            <span style="font-family:'Zuume Cut',sans-serif;font-weight:700;font-size:30px;line-height:1;color:#fff;">{{stat.value}}</span>
            <span style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.4);">{{stat.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position:relative;display:grid;grid-template-columns:{{bodyCols}};gap:{{bodyGap}};padding-top:{{bodyPadTop}};">

    <div class="cc-in" style="animation-delay:.4s;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;">
        <h2 style="font-family:'Zuume Cut',sans-serif;font-weight:900;font-style:italic;font-size:34px;line-height:1;margin:0;text-transform:uppercase;">Squad</h2>
        <span style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.4);">Season 2 roster</span>
      </div>
      <div style="display:grid;grid-template-columns:{{squadCols}};gap:{{squadGap}};">
        <sc-for list="{{squad}}" as="player" hint-placeholder-count="8">
          <div class="cc-player" style="display:flex;flex-direction:column;border:1px solid rgba(255,255,255,0.14);">
            <div style="position:relative;aspect-ratio:3/4;background:#131314;">
              <image-slot id="{{player.slotId}}" shape="rect" placeholder="Drop player photo" style="width:100%;height:100%;"></image-slot>
              <span style="position:absolute;top:10px;left:12px;font-family:'Zuume Cut',sans-serif;font-style:italic;font-weight:900;font-size:15px;color:{{accentColor}};">{{player.num}}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;">
              <span style="font-size:15px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#fff;line-height:1.25;">{{player.name}}</span>
              <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.45);">{{player.role}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="cc-in" style="display:flex;flex-direction:column;gap:22px;animation-delay:.5s;">
      <div style="border:1px solid rgba(255,255,255,0.16);padding:24px;">
        <span style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.5);">Franchise</span>
        <div style="display:flex;flex-direction:column;gap:14px;margin-top:18px;">
          <sc-for list="{{facts}}" as="fact" hint-placeholder-count="4">
            <div style="display:flex;justify-content:space-between;gap:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
              <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.45);">{{fact.label}}</span>
              <span style="font-size:13px;font-weight:600;color:#fff;text-align:right;">{{fact.value}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="border:1px solid rgba(255,255,255,0.16);padding:24px;">
        <span style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.5);">Next matchday</span>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:18px;">
          <sc-for list="{{fixtures}}" as="fx" hint-placeholder-count="3">
            <div style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
              <span style="font-size:13px;font-weight:600;color:#fff;">{{fx.opponent}}</span>
              <span style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45);">{{fx.when}}</span>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>
</section>

<dc-import name="Centre Court Footer" hint-size="100%,120px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ee3a24&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ee3a24&quot;,&quot;#ff5a3c&quot;,&quot;#b3001b&quot;]}}">
class Component extends DCLogic {
  state = {
    isMobile: typeof window !== 'undefined' && window.innerWidth < 860,
    slug: typeof window !== 'undefined' ? (new URLSearchParams(window.location.search).get('team') || 'team-01') : 'team-01',
  };

  updateSize = () => {
    const isMobile = window.innerWidth < 860;
    this.setState(s => (s.isMobile === isMobile ? null : { isMobile }));
  };
  componentDidMount() { window.addEventListener('resize', this.updateSize); }
  componentWillUnmount() { window.removeEventListener('resize', this.updateSize); }

  renderVals() {
    const accentColor = this.props.accentColor ?? '#ee3a24';
    const isMobile = this.state.isMobile;
    const roster = [
      'Player One', 'Player Two', 'Player Three', 'Player Four',
      'Player Five', 'Player Six', 'Player Seven', 'Player Eight',
    ];
    const roles = ['Captain', 'Men\u2019s Singles', 'Women\u2019s Singles', 'Men\u2019s Doubles', 'Women\u2019s Doubles', 'Mixed Doubles', 'Impact Sub', 'Squad'];
    const all = [
      { slug: 'team-01', name: 'Team One', tag: 'Franchise 01' },
      { slug: 'team-02', name: 'Team Two', tag: 'Franchise 02' },
      { slug: 'team-03', name: 'Team Three', tag: 'Franchise 03' },
      { slug: 'team-04', name: 'Team Four', tag: 'Franchise 04' },
      { slug: 'team-05', name: 'Team Five', tag: 'Franchise 05' },
      { slug: 'team-06', name: 'Team Six', tag: 'Franchise 06' },
      { slug: 'team-07', name: 'Team Seven', tag: 'Franchise 07' },
      { slug: 'team-08', name: 'Team Eight', tag: 'Franchise 08' },
    ];
    const idx = Math.max(0, all.findIndex(t => t.slug === this.state.slug));
    const team = all[idx];
    const others = all.filter(t => t.slug !== team.slug);
    return {
      accentColor,
      accentColorDark: '#7d0f0f',
      teamName: team.name,
      teamTag: team.tag,
      slotId: 'team-logo-' + team.slug,
      stats: [
        { value: '8', label: 'Contracted players' },
        { value: '7', label: 'Matchdays' },
        { value: '1', label: 'Home matchday' },
        { value: '\u2014', label: 'League position' },
      ],
      squad: roster.map((name, i) => ({
        num: String(i + 1).padStart(2, '0'),
        name,
        role: roles[i],
        slotId: 'player-' + team.slug + '-' + (i + 1),
      })),
      facts: [
        { label: 'Owner group', value: 'To be announced' },
        { label: 'Home venue', value: 'To be announced' },
        { label: 'Head coach', value: 'To be announced' },
        { label: 'Captain', value: roster[0] },
      ],
      fixtures: others.slice(0, 3).map((o, i) => ({ opponent: 'vs ' + o.name, when: 'Matchday ' + (i + 1) })),
      sectionPadding: isMobile ? '28px 6vw 56px' : '48px 6vw 88px',
      backMargin: isMobile ? '28px' : '40px',
      heroCols: isMobile ? '1fr' : 'auto 1fr',
      heroGap: isMobile ? '28px' : '48px',
      heroPadBottom: isMobile ? '36px' : '52px',
      logoBox: isMobile ? '140px' : '220px',
      statGap: isMobile ? '24px' : '44px',
      squadCols: isMobile ? '1fr 1fr' : 'repeat(4, 1fr)',
      squadGap: isMobile ? '10px' : '14px',
      bodyCols: isMobile ? '1fr' : '2fr 1fr',
      bodyGap: isMobile ? '36px' : '56px',
      bodyPadTop: isMobile ? '36px' : '56px',
    };
  }
}

</script>
</body>
</html>

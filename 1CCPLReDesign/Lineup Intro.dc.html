<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:transparent!important}body{margin:0;font-family:'Schibsted Grotesk',sans-serif}
a{color:#fff}a:hover{color:#E47E48}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wipe{0%{transform:translateX(-101%)}45%{transform:translateX(0)}55%{transform:translateX(0)}100%{transform:translateX(101%)}}
@keyframes nameIn{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.12)}}
</style>
</helmet>
<div data-screen-label="Lineup Intro" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;color:#fff;font-family:'Schibsted Grotesk',sans-serif">

  <div style="position:relative;display:grid;grid-template-rows:auto 1fr;gap:28px;height:100%;padding:48px 56px;box-sizing:border-box">

    <div style="display:flex;align-items:center;gap:28px;padding:18px 32px 18px 20px;border-radius:24px;background:rgba(22,22,22,.85);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 70px rgba(0,0,0,.5)">
      <img src="assets/cc-mark.png" alt="" style="flex:none;height:72px;width:72px;object-fit:contain">
      <div style="flex:none;width:2px;height:56px;background:linear-gradient(180deg,#E47E48,#6200E6)"></div>
      <div style="font:900 56px/1 'Unbounded',sans-serif;letter-spacing:-.035em;text-transform:uppercase">{{ team }}</div>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:18px;font:800 22px/1 'Schibsted Grotesk',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.78);white-space:nowrap">
        <span>Starting Lineup</span>
        <span style="flex:none;width:8px;height:8px;border-radius:50%;background:#E47E48"></span>
        <span style="color:#F2B48F">{{ counter }}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:640px minmax(0,1fr);gap:28px;min-height:0">

      <div style="position:relative;display:flex;flex-direction:column;padding:20px;border-radius:24px;background:rgba(22,22,22,.85);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden">
        <div style="position:absolute;left:20px;right:20px;top:{{ barTop }};height:{{ barH }};border-radius:16px;background:linear-gradient(90deg,#E47E48,#C2652F);box-shadow:0 0 50px rgba(228,126,72,.55);transition:top .55s cubic-bezier(.7,0,.2,1);overflow:hidden">
          {{ progress }}
        </div>
        <sc-for list="{{ rows }}" as="p" hint-placeholder-count="10">
          <div onClick="{{ p.select }}" style="position:relative;display:flex;align-items:center;gap:24px;flex:1 1 0;min-height:0;padding:0 26px;box-sizing:border-box;cursor:pointer">
            <div style="flex:none;width:76px;font:900 40px/1 'Unbounded',sans-serif;letter-spacing:-.04em;text-align:right;color:{{ p.numColor }};transition:color .3s">{{ p.number }}</div>
            <div style="flex:1;min-width:0;font:800 38px/1 'Schibsted Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ p.nameColor }};transition:color .3s">{{ p.name }}</div>
            <div style="flex:none;font:700 18px/1 'Schibsted Grotesk',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:{{ p.roleColor }};transition:color .3s">{{ p.tag }}</div>
          </div>
        </sc-for>
      </div>

      <div style="position:relative;border-radius:24px;overflow:hidden;background:#262626;border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 80px rgba(98,0,230,.25)">
        {{ media }}
        <div style="position:absolute;left:0;right:0;bottom:0;height:380px;background:linear-gradient(180deg,rgba(26,26,26,0),rgba(26,26,26,.92));pointer-events:none"></div>
        {{ nameplate }}
        {{ wipe }}
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:2,&quot;max&quot;:15,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Playback&quot;}}">
class Component extends DCLogic {
  state = {
    i: 0, missing: {},
    team: 'The Mavericks',
    players: [
      { number: 7, name: 'K. Whitfield', role: "Men's Singles", tag: 'C' },
      { number: 11, name: 'E. Tanaka', role: "Women's Singles" },
      { number: 4, name: 'J. Reyes', role: "Men's Doubles" },
      { number: 9, name: 'M. Okafor', role: "Men's Doubles" },
      { number: 22, name: 'A. Novak', role: "Women's Doubles" },
      { number: 3, name: 'R. Singh', role: "Women's Doubles" },
      { number: 15, name: 'B. Achebe', role: "Men's Doubles (2)" },
      { number: 18, name: 'N. Ford', role: "Men's Doubles (2)" },
      { number: 5, name: 'L. Moreau', role: "Women's Doubles (2)" },
      { number: 21, name: 'S. Park', role: "Women's Doubles (2)" },
    ],
  };
  componentDidMount() { this.schedule(); }
  componentWillUnmount() { clearTimeout(this.t); }
  componentDidUpdate(pp) { if (pp.duration !== this.props.duration || pp.autoplay !== this.props.autoplay) this.schedule(); }
  schedule() {
    clearTimeout(this.t);
    if (this.props.autoplay === false) return;
    this.t = setTimeout(() => this.go((this.state.i + 1) % this.state.players.length), (this.props.duration ?? 5) * 1000);
  }
  go(i) { this.setState({ i }, () => this.schedule()); }
  renderVals() {
    const { i, players, missing } = this.state;
    const dur = this.props.duration ?? 5;
    const auto = this.props.autoplay !== false;
    const rowH = 80;
    const cur = players[i];
    const file = `players/${cur.name.replace(/[^a-z]/gi, '').toLowerCase()}.mp4`;
    const h = React.createElement;
    const rows = players.map((p, k) => ({
      ...p, tag: p.tag || '',
      select: () => this.go(k),
      numColor: k === i ? '#1a1a1a' : '#F2B48F',
      nameColor: k === i ? '#1a1a1a' : '#fff',
      roleColor: k === i ? '#1a1a1a' : '#B18CFF',
    }));
    const progress = auto ? h('div', { key: 'pg' + i, style: { position: 'absolute', left: 0, right: 0, bottom: 0, height: 4, background: 'rgba(26,26,26,.55)', transformOrigin: 'left', animation: `fill ${dur}s linear forwards` } }) : null;
    const media = missing[file]
      ? h('div', { key: 'ph' + i, style: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', background: 'repeating-linear-gradient(135deg,#2b2b2b 0 22px,#262626 22px 44px)' } },
          h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14, marginTop: -160, textAlign: 'center' } },
            h('div', { style: { font: "800 20px/1 'Schibsted Grotesk',sans-serif", letterSpacing: '.24em', textTransform: 'uppercase', color: 'rgba(255,255,255,.6)' } }, 'Player video'),
            h('div', { style: { font: "500 22px/1.3 ui-monospace,monospace", color: '#D4BEFF' } }, file)))
      : h('video', { key: 'v' + i, src: file, autoPlay: true, muted: true, loop: true, playsInline: true,
          onError: () => this.setState(s => ({ missing: { ...s.missing, [file]: true } })),
          style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' } });
    const nameplate = h('div', { key: 'np' + i, style: { position: 'absolute', left: 56, right: 56, bottom: 48, display: 'flex', alignItems: 'flex-end', gap: 32, animation: 'nameIn .6s .35s cubic-bezier(.2,.8,.2,1) both' } },
      h('div', { style: { font: "900 200px/1 'Unbounded',sans-serif", letterSpacing: '-.07em', padding: '0 .08em 0 0', marginBottom: -28, background: 'linear-gradient(180deg,#fff 25%,#F2B48F 70%,#B18CFF)', WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent' } }, cur.number),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, paddingBottom: 6 } },
        h('div', { style: { font: "800 22px/1 'Schibsted Grotesk',sans-serif", letterSpacing: '.24em', textTransform: 'uppercase', color: '#F2B48F' } }, cur.role + (cur.tag === 'C' ? ' · Captain' : '')),
        h('div', { style: { font: "900 72px/1 'Unbounded',sans-serif", letterSpacing: '-.035em', textTransform: 'uppercase' } }, cur.name)));
    const wipe = h('div', { key: 'w' + i, style: { position: 'absolute', inset: 0, background: 'linear-gradient(90deg,#6200E6,#E47E48)', transform: 'translateX(101%)', animation: i === this.first ? 'none' : 'wipe .8s cubic-bezier(.7,0,.3,1)', pointerEvents: 'none' } });
    if (this.first === undefined) this.first = i;
    return {
      team: this.state.team, rows, progress, media, nameplate, wipe,
      barH: `calc((100% - 40px) / ${players.length})`,
      barTop: `calc(20px + (100% - 40px) * ${i / players.length})`,
      counter: `${String(i + 1).padStart(2, '0')} / ${String(players.length).padStart(2, '0')}`,
    };
  }
}
</script>
</body>
</html>
